<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Admin - Wireframe</title>
  <link rel="stylesheet" href="chalk.css">
  <style>
    body { background: #f0f0f0; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .login-card { width: 400px; }
  </style>
</head>
<body>
  <div class="wf-card login-card">
    <div class="wf-vertical wf-gap-lg wf-padding-lg">
      <div class="wf-text wf-center wf-high">Masuk ke Akun Anda</div>
      <div class="wf-text wf-muted wf-center wf-small">Silakan masuk untuk mengakses panel administrasi</div>
      <div class="wf-vertical wf-gap-sm">
        <div class="wf-text wf-label">Email</div>
        <div class="wf-input">admin@w9cafe.com</div>
      </div>
      <div class="wf-vertical wf-gap-sm">
        <div class="wf-text wf-label">Kata Sandi</div>
        <div class="wf-input">••••••••••</div>
      </div>
      <div class="wf-btn wf-primary wf-full">Masuk</div>
      <div class="wf-text wf-muted wf-center wf-small">W9 Cafe - Sistem Point of Sale</div>
    </div>
  </div>
</body>
</html>

services:
    pgsql:
        image: 'postgres:18-alpine'
        ports:
            - '${FORWARD_DB_PORT:-5432}:5432'
        environment:
            PGPASSWORD: '${DB_PASSWORD:-secret}'
            POSTGRES_DB: '${DB_DATABASE}'
            POSTGRES_USER: '${DB_USERNAME}'
            POSTGRES_PASSWORD: '${DB_PASSWORD:-secret}'
        volumes:
            - 'pos-pgsql:/var/lib/postgresql'
            - './docker/postgres/create-testing-database.sql:/docker-entrypoint-initdb.d/10-create-testing-database.sql'
        networks:
            - pos
        healthcheck:
            test: ["CMD", "pg_isready", "-q", "-d", "${DB_DATABASE}", "-U", "${DB_USERNAME}"]
            retries: 3
            timeout: 5s
    redis:
        image: 'redis:alpine'
        ports:
            - '${FORWARD_REDIS_PORT:-6379}:6379'
        volumes:
            - 'pos-redis:/data'
        networks:
            - pos
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            retries: 3
            timeout: 5s
    app:
        build:
            context: .
            dockerfile: Dockerfile
        image: 'w9cafe-pos:latest'
        profiles:
            - prod
        environment:
            APP_ENV: '${APP_ENV:-production}'
            APP_DEBUG: '${APP_DEBUG:-false}'
            APP_URL: '${APP_URL:-http://localhost:8081}'
            REDIS_HOST: 'redis'
            REDIS_PORT: '${REDIS_PORT:-6379}'
            REDIS_PASSWORD: '${REDIS_PASSWORD:-null}'
        volumes:
            - '.:/var/www/html'
            - 'storage-data:/var/www/html/storage/app/public'
        ports:
            - '${PROD_APP_PORT:-8081}:80'
        networks:
            - pos
        depends_on:
            pgsql:
                condition: service_healthy
            redis:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:80/up"]
    datamining:
        build:
            context: .
            dockerfile: datamining/Dockerfile
        image: 'w9cafe-datamining:latest'
        environment:
            DB_HOST: 'pgsql'
            DB_PORT: '5432'
            DB_DATABASE: '${DB_DATABASE:-pos_cafe}'
            DB_USERNAME: '${DB_USERNAME:-postgres}'
            DB_PASSWORD: '${DB_PASSWORD:-secret}'
        networks:
            - pos
        ports:
            - '${DATAMINING_PORT:-8001}:8001'
        mem_limit: 1g
        restart: unless-stopped
        depends_on:
            pgsql:
                condition: service_healthy
networks:
    pos:
        driver: bridge
volumes:
    pos-pgsql:
        driver: local
    pos-redis:
        driver: local
    storage-data:
        driver: local
